basePath: /
definitions:
  apperr.Code:
    enum:
    - invalid_json
    - invalid_input
    - invalid_policy
    - inference_error
    - request_too_large
    - method_not_allowed
    - not_found
    - internal_error
    type: string
    x-enum-varnames:
    - InvalidJSON
    - InvalidInput
    - InvalidPolicy
    - InferenceError
    - TooLarge
    - MethodNotAllowed
    - NotFound
    - Internal
  apperr.Error:
    properties:
      code:
        $ref: '#/definitions/apperr.Code'
      message:
        type: string
    type: object
  httpapi.inferRequest:
    properties:
      input:
        type: object
      policy_dot:
        example: digraph P { start [result=""]; ok [result="approved=true"]; start
          -> ok [cond="age>=18"] }
        type: string
    type: object
  httpapi.inferResponse:
    properties:
      output:
        type: object
    type: object
host: localhost:8080
info:
  contact: {}
  description: Executes one deterministic path through a DOT policy graph and returns
    the enriched variables.
  title: Policy Inference API
  version: "1.0"
paths:
  /infer:
    post:
      consumes:
      - application/json
      description: Validates the request, parses the DOT policy graph, executes a
        single path, and returns the enriched variables.
      parameters:
      - description: DOT policy and input variables
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.inferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: input variables plus inferred values
          schema:
            $ref: '#/definitions/httpapi.inferResponse'
        "400":
          description: invalid_json, invalid_input, invalid_policy or inference_error
          schema:
            $ref: '#/definitions/apperr.Error'
        "404":
          description: path is not /infer
          schema:
            $ref: '#/definitions/apperr.Error'
        "405":
          description: method is not POST
          schema:
            $ref: '#/definitions/apperr.Error'
        "413":
          description: request body exceeds the configured limit
          schema:
            $ref: '#/definitions/apperr.Error'
        "500":
          description: unexpected internal failure
          schema:
            $ref: '#/definitions/apperr.Error'
      summary: Run one deterministic inference over a DOT policy
      tags:
      - inference
schemes:
- http
swagger: "2.0"
